# InferGraph cloudless stack (P0–P4).
#
# Example:
#   uv run --project inferegistry inferegistry pack ... --cache-dir ./infergraph-cache
#   docker compose -f docker/compose.infergraph-cloudless.yml up --build

services:
  inferegistry:
    image: ${INFERGRAPH_REGISTRY_IMAGE:-python:3.11-slim}
    working_dir: /app
    command:
      - bash
      - -lc
      - |
        pip install -q -e /app/inferegistry &&
        inferegistry serve --host 0.0.0.0 --port 8000 \
          --registry-root /cache \
          --public-base-url http://inferegistry:8000
    environment:
      INFERGRAPH_REGISTRY_ROOT: /cache
      INFERENCE_HOME: /cache
      MODEL_CACHE_DIR: /cache
    volumes:
      - ${INFERGRAPH_CACHE_DIR:-../infergraph-cache}:/cache
      - ../inferegistry:/app/inferegistry
      - ../inference_models:/app/inference_models
    ports:
      - "${INFERGRAPH_REGISTRY_PORT:-8000}:8000"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/healthz')"]
      interval: 10s
      timeout: 3s
      retries: 10

  inference:
    build:
      context: ..
      dockerfile: docker/dockerfiles/Dockerfile.infergraph.cpu
    image: ${INFERGRAPH_IMAGE:-infergraph/inference-cpu:local}
    env_file:
      - env.infergraph
    ports:
      - "${INFERGRAPH_PORT:-9001}:9001"
    volumes:
      - ${INFERGRAPH_CACHE_DIR:-../infergraph-cache}:/cache
    depends_on:
      inferegistry:
        condition: service_healthy
    restart: unless-stopped
